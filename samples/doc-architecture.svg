      <text x="0" y="60" fill="#9ca3af" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
        High level service topology and data communication pipeline.
      </text>
      

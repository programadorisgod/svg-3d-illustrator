      <path d="M 108 260 l 6 5 l -6 5 M 118 270 h 6" fill="none" stroke="#828fff" stroke-width="2" stroke-linecap="round" />

      
        <rect x="248" y="254" width="50" height="18" rx="9" fill="#38bdf81a" stroke="#38bdf840" stroke-width="1" />
        <circle cx="258" cy="263" r="2.5" fill="#38bdf8" />
        <text x="266" y="266" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Edge</text>
      

      <text 

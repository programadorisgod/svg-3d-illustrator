        rx="12" 
        fill="#12141c" 
        stroke="rgba(94, 106, 210, 0.4)" 
        stroke-width="1.2"
        filter="url(#shadow-blur-6)" 
      />

      <rect x="702" y="254" width="28" height="28" rx="8" fill="#1a1d29" />
      <ellipse cx="716" cy="262" rx="10" ry="4" fill="none" stroke="#828fff" stroke-width="1.8" /><path d="M 706 262 v 8 a 10 4 0 0 0 20 0 v -8" fill="none" stroke="#828fff" stroke-width="1.8" />

      
        <rect x="848" y="254" width="50" height="18" rx="9" fill="#10b9811a" stroke="#10b98140" stroke-width="1" />
        <circle cx="858" cy="263" r="2.5" fill="#10b981" />
        <text x="866" y="266" fill="#10b981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Replica</text>
      

      <text 
        x="738" 
        y="272" 
        fill="#f3f4f6" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600"
      >Primary Database</text>

      <text 
        x="706" 
        y="300" 
        fill="#9ca3af" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12" 
        font-weight="400"
      >PostgreSQL + Redis Cache</text>
    </g>
  

    <!-- Callout de información al pie -->
    <g class="doc-footer-callout" transform="translate(60, 420)">
      <rect x="0" y="0" width="880" height="70" rx="8" fill="#12141c" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="28" cy="35" r="10" fill="#828fff22" />
      <text x="28" y="39" text-anchor="middle" fill="#828fff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">i</text>
      <text x="52" y="32" fill="#f3f4f6" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Alta Disponibilidad &amp; Encriptación E2E</text>
      <text x="52" y="52" fill="#9ca3af" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Todos los enlaces utilizan mTLS con cifrado AES-256 y enrutamiento automático ante fallos de zona.</text>

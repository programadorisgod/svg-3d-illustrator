      <path d="M 416 256 l 9 4 v 6 c 0 5 -4 9 -9 11 c -5 -2 -9 -6 -9 -11 v -6 z" fill="none" stroke="#828fff" stroke-width="1.8" />

      
        <rect x="548" y="254" width="50" height="18" rx="9" fill="#a855f71a" stroke="#a855f740" stroke-width="1" />
        <circle cx="558" cy="263" r="2.5" fill="#a855f7" />
        <text x="566" y="266" fill="#a855f7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">mTLS</text>
      

      <text 
        x="438" 

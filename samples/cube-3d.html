<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: 3D Vector Isometric Solid - svg-3d-illustrator</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #131722;
      --border: #232936;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background: #1e2433;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      overflow: auto;
      background: radial-gradient(#1e2433 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .svg-wrapper {
      max-width: 95vw;
      max-height: 80vh;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: transparent;
      display: flex;
    }
    .svg-wrapper svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .light-mode {
      background: #ffffff !important;
    }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center;">
      <h1 style="font-size: 16px; font-weight: 700;">3D Vector Isometric Solid</h1>
      <span class="badge">3d-projection</span>
      <span class="badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">dark-linear</span>
    </div>
    <div class="controls">
      <button onclick="toggleBackground()">Toggle Fondo</button>
      <button onclick="copySvg()">Copiar SVG</button>
    </div>
  </header>
  <main>
    <div class="svg-wrapper" id="canvas-container">
      <?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  viewBox="0 0 1000 600" 
  width="1000" 
  height="600"
  role="img"
  aria-label="3D Vector Isometric Solid"
>
  <title>3D Vector Isometric Solid</title>
  <desc>Deterministic 3D SVG Generated by svg-3d-illustrator</desc>
  
  <defs>
    <!-- Filtros de sombra y blur ambiental -->
    <filter id="shadow-blur-6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-blur-12" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="glow-ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes principales -->
    <linearGradient id="grad-primary-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="grad-accent-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4b2" />
      <stop offset="100%" stop-color="#5e6ad2" />
    </linearGradient>

    <!-- Gradientes de caras 3D e isométricas -->
    <linearGradient id="iso-top-face" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="iso-left-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e6ad2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="iso-right-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Aurora y Fondos -->
    <radialGradient id="aurora-glow-1" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00d4b2" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#5e6ad2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-glow-2" cx="70%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#5e6ad2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>

    <!-- Patrón de rejilla de puntos -->
    <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)" />
    </pattern>

    <!-- Patrón de cuadrícula continua -->
    <pattern id="grid-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>
  
  
      <rect width="1000" height="600" fill="#08090d" />
      <rect width="1000" height="600" fill="url(#dot-pattern)" opacity="0.3" />
      <circle cx="500" cy="300" r="160" fill="#5e6ad2" opacity="0.1" filter="url(#glow-ambient)" />
      
    <g class="mesh-3d" transform="translate(0, 0)">
      <polygon points="425.25,461.5 614.14,447.5 679.7,317.42 506.1,346.93" fill="#8f98e0" stroke="rgba(94, 106, 210, 0.4)" stroke-width="1.2" stroke-linejoin="round" data-face="front" />
    <polygon points="506.1,346.93 679.7,317.42 582.88,120.92 408.2,181.37" fill="#6772d5" stroke="rgba(94, 106, 210, 0.4)" stroke-width="1.2" stroke-linejoin="round" data-face="top" />
    <polygon points="425.25,461.5 506.1,346.93 408.2,181.37 303.52,280.95" fill="#5d69d1" stroke="rgba(94, 106, 210, 0.4)" stroke-width="1.2" stroke-linejoin="round" data-face="left" />
    </g>
  
    
</svg>
    </div>
  </main>

  <script>
    function toggleBackground() {
      const el = document.getElementById('canvas-container');
      el.classList.toggle('light-mode');
    }
    function copySvg() {
      const svg = document.querySelector('svg').outerHTML;
      navigator.clipboard.writeText(svg).then(() => {
        alert('¡Código SVG copiado al portapapeles!');
      });
    }
  </script>
</body>
</html>

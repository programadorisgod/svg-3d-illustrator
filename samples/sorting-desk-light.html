  <style>
    :root {
      --bg: #090a0f;
      --panel: #131722;
      --border: #232936;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background: #1e2433;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      overflow: auto;
      background: radial-gradient(#1e2433 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .svg-wrapper {
      max-width: 95vw;
      max-height: 80vh;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: transparent;
      display: flex;
    }
    .svg-wrapper svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .light-mode {
      background: #ffffff !important;
    }
  </style>
</head>

<?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  viewBox="0 0 1000 600" 
  width="1000" 
  height="600"
  role="img"
  aria-label="Fluid Vector Mesh"
>
  <title>Fluid Vector Mesh</title>
  <desc>Deterministic 3D SVG Generated by svg-3d-illustrator</desc>
  
  <defs>
    <!-- Filtros de sombra y blur ambiental -->
    <filter id="shadow-blur-6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-blur-12" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="glow-ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes principales -->
    <linearGradient id="grad-primary-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="grad-accent-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gradientes de caras 3D e isométricas -->
    <linearGradient id="iso-top-face" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="iso-left-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="iso-right-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Aurora y Fondos -->
    <radialGradient id="aurora-glow-1" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-glow-2" cx="70%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <!-- Patrón de rejilla de puntos -->
    <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(15, 23, 42, 0.04)" />
    </pattern>

    <!-- Patrón de cuadrícula continua -->
    <pattern id="grid-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1" />
    </pattern>
  </defs>
  
  
    <!-- Filtro de difusión atmosférica de alto radio sin recorte -->
    <defs>
      <filter id="aurora-blur-heavy" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="64" />
      </filter>
      <filter id="aurora-blur-medium" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="36" />
      </filter>
      <linearGradient id="aurora-ribbon-1" x1="0%" y1="0%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
        <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
      </linearGradient>
      <linearGradient id="aurora-ribbon-2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.75" />
        <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.85" />
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
      </linearGradient>
      <linearGradient id="aurora-ribbon-3" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
        <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
      </linearGradient>
      <radialGradient id="aurora-bg-mesh" cx="50%" cy="40%" r="75%">
        <stop offset="0%" stop-color="#e0e7ff" stop-opacity="1" />
        <stop offset="65%" stop-color="#f8fafc" stop-opacity="1" />
        <stop offset="100%" stop-color="#f1f5f9" stop-opacity="1" />
      </radialGradient>
      <clipPath id="aurora-frame-clip">
        <rect width="1000" height="600" rx="24" />
      </clipPath>
    </defs>

    <!-- Marco recortado con esquinas suaves de 24px para evitar bordes duros cortados -->
    <g clip-path="url(#aurora-frame-clip)">
      <!-- Fondo Degradado Atmosférico Profundo -->
      <rect width="1000" height="600" fill="url(#aurora-bg-mesh)" />

      <!-- Orbes difusos de resplandor boreal ambiental (Capa 0: Atmósfera) -->
      <g filter="url(#aurora-blur-heavy)" opacity="0.65">
        <ellipse cx="300" cy="210" rx="320" ry="240" fill="#6366f1" />
        <ellipse cx="720" cy="252" rx="350" ry="270" fill="#06b6d4" />
        <circle cx="500" cy="150" r="280" fill="#10b981" />
        <circle cx="850" cy="420" r="220" fill="#f43f5e" />
      </g>

      <!-- Velo Boreal 1: Cinta ondulante principal (Cyan/Emerald) -->
      <path d="
        M -50 288
        C 250 120, 420 450, 700 228
        C 880 96, 950 300, 1060 192
        L 1060 660
        L -50 660
        Z
      " fill="url(#aurora-ribbon-1)" opacity="0.75" filter="url(#aurora-blur-medium)" />

      <!-- Velo Boreal 2: Cinta ondulante secundaria (Violet/Rose) en contrapunto -->
      <path d="
        M -60 372
        C 180 468, 480 192, 750 348
        C 890 432, 960 252, 1060 330
        L 1060 660
        L -60 660
        Z
      " fill="url(#aurora-ribbon-2)" opacity="0.65" filter="url(#aurora-blur-medium)" />

      <!-- Velo Boreal 3: Cinta de luz frontal nítida con curvas Bézier armónicas -->
      <path d="
        M 0 330
        C 220 228, 440 432, 680 270
        C 840 156, 940 312, 1000 252
        L 1000 600
        L 0 600
        Z
      " fill="url(#aurora-ribbon-3)" opacity="0.45" />

      <!-- Resplandor de cresta de onda (Fina línea luminosa de luz) -->
      <path d="
        M 0 330
        C 220 228, 440 432, 680 270
        C 840 156, 940 312, 1000 252
      " fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />

      <!-- Cuadrícula sutil de estrellas / puntos técnicos luminosos -->
      <rect width="1000" height="600" fill="url(#dot-pattern)" opacity="0.18" />

      <!-- Borde de marco interior elegante -->
      <rect x="1" y="1" width="998" height="598" rx="23" fill="none" stroke="#cbd5e1" stroke-width="2" />

      <!-- Textos Opcionales -->
      
    </g>
  
</svg>